name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version metadata
        run: |
          echo "MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_ENV"
          echo "MC_VERSION=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_ENV"

      - name: Build release artifacts
        run: ./gradlew build --stacktrace

      - name: Validate jar metadata
        run: |
          unzip -p "build/libs/structurecodex-${MOD_VERSION}+${MC_VERSION}.jar" fabric.mod.json > fmj.json
          cat fmj.json
          grep -q "\"version\": \"${MOD_VERSION}+${MC_VERSION}\"" fmj.json

      - name: Publish to Modrinth and GitHub
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          modrinth-id: QoJh8dO8
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            build/libs/!(*-@(dev|sources|javadoc)).jar
          name: ${{ env.MOD_VERSION }}+${{ env.MC_VERSION }}
          version-type: release
          game-versions: ${{ env.MC_VERSION }}
          changelog-file: CHANGELOG.md
          retry-attempts: 3
